name: Native Android
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35
          path: dependencies/Idric
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fuego-ironworks/idric-arm-thumb
          ref: 76a5c5086b01abd57d2e4bb763bcd7a5ddc5b524
          path: dependencies/dex
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ad3c35f8fc874607a4773cf8384d0ac3056742b1
          path: dependencies/ai-ci
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Restore pinned compiler build
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: zoneedit-idric-0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35-ubuntu24-x86_64-v1
          path: |
            dependencies/Idric/_/.tools
            dependencies/Idric/_/bootstrap-build
            dependencies/Idric/_/build
            dependencies/Idric/_/libs/*/build
            dependencies/Idric/_/support
      - name: Bootstrap pinned Idriç compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: ./dependencies/Idric/edric bootstrap
      - name: Save successfully compiled dependency
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: zoneedit-idric-0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35-ubuntu24-x86_64-v1
          path: |
            dependencies/Idric/_/.tools
            dependencies/Idric/_/bootstrap-build
            dependencies/Idric/_/build
            dependencies/Idric/_/libs/*/build
            dependencies/Idric/_/support
      - name: Configure native build
        run: >-
          cmake -S . -B build/native -DANDROID_SDK_ROOT=$ANDROID_HOME
          -DIDRIC_EXECUTABLE=${{ github.workspace }}/dependencies/Idric/_/build/exec/idris2
          -DIDRIC_SUPPORT_DIR=${{ github.workspace }}/dependencies/Idric/_
          -DIDRIC_SCHEME=${{ github.workspace }}/dependencies/Idric/_/.tools/bin/scheme
          -DDEX_BACKEND_DIR=${{ github.workspace }}/dependencies/dex
          -DAICI_DIR=${{ github.workspace }}/dependencies/ai-ci
      - name: Build Idriç, direct DEX, native libraries and signed APK
        run: cmake --build build/native --parallel 3
      - name: Exercise URL policy
        run: cmake --build build/native --target navigation-test
      - name: Verify declared toolchains
        run: cmake -DAICI_DIR=${{ github.workspace }}/dependencies/ai-ci -DNDK=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin -P _/toolchain-check.cmake
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install, launch, recreate and reopen on Android 14
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -dns-server 1.1.1.1,8.8.8.8 -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -camera-front none
          script: cmake -DBUILD=${{ github.workspace }}/build/native -P _/runtime-check.cmake
      - name: Retain signed APK and exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zoneedit-native-apk
          path: |
            build/native/zoneedit-mobile.apk
            build/native/zoneedit-classes.checked.anf
            build/native/build-receipt.txt
            build/native/apk/signer-receipt.txt
            build/native/runtime/
          if-no-files-found: error
